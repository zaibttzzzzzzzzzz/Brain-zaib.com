<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brainzaib AI Assistant</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0b0b;
      color: #f1f1f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .logo {
      margin-top: 10px;
      width: 180px;
    }

    h1 {
      margin-top: 5px;
      color: #00fff2;
      font-size: 28px;
      text-shadow: 0 0 10px #00fff2;
    }

    .chat-box {
      width: 100%;
      max-width: 600px;
      background: #1a1a1a;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #00fff2;
      margin-top: 20px;
    }

    .messages {
      height: 300px;
      overflow-y: auto;
      margin-bottom: 15px;
      padding-right: 10px;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      background: #00fff2;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .user, .bot {
      margin: 5px 0;
      padding: 8px;
      border-radius: 5px;
    }

    .user {
      background: #333;
      text-align: right;
    }

    .bot {
      background: #222;
      text-align: left;
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <img src="https://files.catbox.moe/jv3ui6.jpg" alt="Brainzaib Logo" class="logo" />
  <h1>Brainzaib AI Assistant</h1>

  <!-- Chat Box -->
  <div class="chat-box">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ask something..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById("messages");

    function sendMessage() {
      const input = document.getElementById("userInput");
      const userText = input.value.trim();
      if (!userText) return;

      addMessage("user", userText);
      input.value = "";

      let botReply = "I'm still thinking...";

      // Basic reply logic
      const lower = userText.toLowerCase();
      if (lower.includes("hello") || lower.includes("hi")) {
        botReply = "Hello! I'm Brainzaib. How can I help you today?";
      } else if (lower.includes("your name")) {
        botReply = "I'm Brainzaib — your intelligent assistant.";
      } else if (lower.includes("language")) {
        botReply = "I can understand many languages! Try me.";
      } else if (lower.includes("who created you")) {
        botReply = "I was created by Shazaib — a future tech genius.";
      } else if (lower.includes("bye")) {
        botReply = "Goodbye! Have a powerful day.";
      }

      setTimeout(() => {
        addMessage("bot", botReply);
      }, 600);
    }

    function addMessage(type, text) {
      const msg = document.createElement("div");
      msg.className = type;
      msg.textContent = text;
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>

</body>
  </html>
